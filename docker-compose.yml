services:
  catalog-service:
    build: ./catalog-service
    ports:
      - "8081:8081"
    environment:
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      RESERVATION_TTL_MINUTES: ${RESERVATION_TTL_MINUTES:-15}

  customer-service:
    build: ./customer-service
    ports:
      - "8082:8082"
    environment:
      ORDER_SERVICE_URL: http://order-service:8083

  order-service:
    build: ./order-service
    ports:
      - "8083:8083"
    environment:
      CATALOG_SERVICE_URL: http://catalog-service:8081
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      RESERVATION_TTL_MINUTES: ${RESERVATION_TTL_MINUTES:-15}
