server.port=8083
spring.application.name=order-service

spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
server.error.include-message=always

catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:8081}
customer.service.url=${CUSTOMER_SERVICE_URL:http://localhost:8082}

reservation.ttl-minutes=${RESERVATION_TTL_MINUTES:15}
reservation.review-ttl-minutes=${RESERVATION_REVIEW_TTL_MINUTES:1440}

legacy.pricing.v1.enabled=false
