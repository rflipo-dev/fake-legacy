server.port=8081
spring.application.name=catalog-service

spring.datasource.url=jdbc:h2:mem:catalogdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
server.error.include-message=always

customer.service.url=${CUSTOMER_SERVICE_URL:http://localhost:8082}
order.service.url=${ORDER_SERVICE_URL:http://localhost:8083}

reservation.ttl-minutes=${RESERVATION_TTL_MINUTES:15}
